<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚲 鹈鹕海边骑行</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(#8fd0f4 0%, #cdeafd 55%, #e6f7ff 100%);
    cursor: pointer;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  svg#ride {
    width: min(88vmin, 640px); height: auto; display: block;
    transition: transform .3s ease-out;
  }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font: 14px/1.6 system-ui, sans-serif; color: #34617a;
    background: rgba(255,255,255,.55); backdrop-filter: blur(4px);
    padding: 4px 14px; border-radius: 999px;
    transition: opacity .8s; user-select: none;
  }

  /* ===== 场景动画（与 README 内嵌版一致） ===== */
#wheel-rear, #wheel-front { transform-box: fill-box; transform-origin: center; animation: spin .9s linear infinite; }
    #crank   { transform-box: view-box; transform-origin: 262px 388px; animation: spin 1.8s linear infinite; }
    .pedal   { transform-box: fill-box; transform-origin: center; animation: spin-inv 1.8s linear infinite; }
    /* 腿：两段式 IK，脚掌逐帧锁定踏板 */
    .thighN,.shinN,.footN,.thighF,.shinF,.footF { transform-box: view-box; transform-origin: 0 0; }
    .thighN{animation:thighN 1.8s linear infinite}
    .shinN {animation:shinN  1.8s linear infinite}
    .footN {animation:footN  1.8s linear infinite}
    .thighF{animation:thighF 1.8s linear infinite}
    .shinF {animation:shinF  1.8s linear infinite}
    .footF {animation:footF  1.8s linear infinite}
    #pelican { animation: bob .55s ease-in-out infinite; }
    #scarf   { transform-box: view-box; transform-origin: 314px 192px; animation: flutter .5s ease-in-out infinite; }
    #pouch   { transform-box: view-box; transform-origin: 347px 171px; animation: jiggle .55s ease-in-out infinite; }
    #fish    { transform-box: fill-box; transform-origin: center; animation: wiggle 1.2s ease-in-out infinite; }
    #roaddash{ animation: dashmove .55s linear infinite; }
    #cloud1  { animation: drift 9s ease-in-out infinite; }
    #cloud2  { animation: drift 12s ease-in-out infinite reverse; }
    #gull1   { animation: gullbob 2.4s ease-in-out infinite; }
    #gull2   { animation: gullbob 3.1s ease-in-out infinite .4s; }
    #speed   { animation: pulse .55s ease-in-out infinite; }

    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes spin-inv { to { transform: rotate(-360deg); } }

    @keyframes bob      { 0%,100% { transform: translateY(0); }  50% { transform: translateY(-2.5px); } }
    @keyframes flutter  { 0%,100% { transform: rotate(0deg); }   50% { transform: rotate(7deg); } }
    @keyframes jiggle   { 0%,100% { transform: scaleY(1); }      50% { transform: scaleY(1.05); } }
    @keyframes wiggle   { 0%,100% { transform: rotate(-5deg); }  50% { transform: rotate(6deg); } }
    @keyframes dashmove { to { stroke-dashoffset: 104; } }
    @keyframes drift    { 0%,100% { transform: translateX(0); }  50% { transform: translateX(26px); } }
    @keyframes gullbob  { 0%,100% { transform: translateY(0); }  50% { transform: translateY(-6px); } }
    @keyframes pulse    { 0%,100% { opacity: .35; } 50% { opacity: .85; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  #speed { transition: opacity .25s; }
  /* 点击加速 */
  body.boost #wheel-rear, body.boost #wheel-front { animation-duration: .28s; }
  body.boost #pelican  { animation-duration: .32s; }
  body.boost #roaddash { animation-duration: .14s; }
  body.boost #pouch    { animation-duration: .3s; }
  body.boost #fish     { animation-duration: .4s; }
  body.boost #speed    { opacity: .95; }
  body.boost #crank, body.boost .pedal,
  body.boost .thighN, body.boost .shinN, body.boost .footN,
  body.boost .thighF, body.boost .shinF, body.boost .footF { animation-duration: .56s; }

</head>
<body>
<div id="stage">
<svg id="ride" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g id="scene">
<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0f4"/>
      <stop offset="100%" stop-color="#e6f7ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a9dd6"/>
      <stop offset="100%" stop-color="#67cbea"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2dfae"/>
      <stop offset="100%" stop-color="#e8cf96"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="512" height="332" fill="url(#sky)"/>

  <!-- sun -->
  <path d="M146 100 L158 100 M135 125 L144 134 M110 136 L110 148 M85 125 L76 134 M74 100 L62 100 M85 75 L76 66 M110 64 L110 52 M135 75 L144 66" stroke="#ffd93b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="100" r="30" fill="#ffd93b"/>

  <!-- clouds -->
  <g id="cloud1" fill="#ffffff" opacity="0.92">
    <ellipse cx="392" cy="72" rx="34" ry="15"/>
    <ellipse cx="368" cy="80" rx="22" ry="12"/>
    <ellipse cx="414" cy="80" rx="20" ry="11"/>
  </g>
  <g id="cloud2" fill="#ffffff" opacity="0.85">
    <ellipse cx="170" cy="138" rx="26" ry="11"/>
    <ellipse cx="152" cy="145" rx="16" ry="8"/>
  </g>

  <!-- seagulls -->
  <g id="gull1" fill="none" stroke="#5a6b7a" stroke-width="3" stroke-linecap="round">
    <path d="M140 182 q8,-8 16,0 q8,-8 16,0"/>
  </g>
  <g id="gull2" fill="none" stroke="#5a6b7a" stroke-width="3" stroke-linecap="round">
    <path d="M360 120 q7,-7 14,0 q7,-7 14,0"/>
  </g>

  <!-- sea -->
  <rect x="0" y="330" width="512" height="65" fill="url(#sea)"/>

  <!-- sailboat -->
  <line x1="452" y1="322" x2="452" y2="294" stroke="#5a4632" stroke-width="2.5"/>
  <path d="M454 296 L474 318 L454 318 Z" fill="#ffffff"/>
  <path d="M450 300 L438 318 L450 318 Z" fill="#f2f2f2"/>
  <path d="M438 322 L466 322 L459 330 L445 330 Z" fill="#7a5230"/>

  <!-- waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.55" stroke-width="4">
    <path d="M24 352 q14,-8 28,0 t28,0"/>
    <path d="M298 344 q14,-8 28,0 t28,0"/>
    <path d="M88 372 q14,-8 28,0 t28,0"/>
    <path d="M362 370 q14,-8 28,0 t28,0"/>
  </g>

  <!-- sand -->
  <rect x="0" y="394" width="512" height="118" fill="url(#sand)"/>
  <rect x="0" y="394" width="512" height="9" fill="#d9c08f" opacity="0.8"/>
  <path d="M6 404 q18,-9 36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.75"/>

  <!-- 车辙（向后滚动） -->
  <path id="roaddash" d="M30 470 H465" stroke="#cbb27e" stroke-opacity="0.9" stroke-width="5" stroke-dasharray="34 18" stroke-linecap="round" fill="none"/>

  <!-- starfish / shell -->
  <path d="M0,-1 L0.2245,-0.309 L0.951,-0.309 L0.363,0.118 L0.588,0.809 L0,0.382 L-0.588,0.809 L-0.363,0.118 L-0.951,-0.309 L-0.2245,-0.309 Z" transform="translate(408 462) rotate(15) scale(13)" fill="#ff9f43" stroke="#e88b2f" stroke-width="0.15"/>
  <path d="M150 476 Q160 458 170 476 Z" fill="#f7c8d0" stroke="#e8a7b5" stroke-width="2"/>
  <path d="M160 462 L160 474" stroke="#e8a7b5" stroke-width="1.5"/>

  <!-- shadow -->
  <ellipse cx="262" cy="466" rx="135" ry="13" fill="#5b4a2f" opacity="0.15"/>

  <!-- 速度线 -->

    <path d="M56 240 h32"/>
    <path d="M42 262 h26"/>
    <path d="M50 286 h20"/>
  </g>

  <!-- rear wheel -->
  <g id="wheel-rear">
    <g stroke="#c3c9d1" stroke-width="3.5">
      <line x1="122" y1="400" x2="238" y2="400"/>
      <line x1="122" y1="400" x2="238" y2="400" transform="rotate(30 180 400)"/>
      <line x1="122" y1="400" x2="238" y2="400" transform="rotate(60 180 400)"/>

      <line x1="122" y1="400" x2="238" y2="400" transform="rotate(150 180 400)"/>

    <circle cx="180" cy="400" r="50" fill="none" stroke="#d8dde3" stroke-width="5"/>
    <circle cx="180" cy="400" r="58" fill="none" stroke="#2f3640" stroke-width="11"/>
    <circle cx="180" cy="400" r="9" fill="#57606f"/>

  <!-- front wheel -->
  <g id="wheel-front">
    <g stroke="#c3c9d1" stroke-width="3.5">
      <line x1="287" y1="400" x2="403" y2="400"/>
      <line x1="287" y1="400" x2="403" y2="400" transform="rotate(30 345 400)"/>
      <line x1="287" y1="400" x2="403" y2="400" transform="rotate(60 345 400)"/>
      <line x1="287" y1="400" x2="403" y2="400" transform="rotate(90 345 400)"/>
      <line x1="287" y1="400" x2="403" y2="400" transform="rotate(120 345 400)"/>
      <line x1="287" y1="400" x2="403" y2="400" transform="rotate(150 345 400)"/>

    <circle cx="345" cy="400" r="50" fill="none" stroke="#d8dde3" stroke-width="5"/>
    <circle cx="345" cy="400" r="58" fill="none" stroke="#2f3640" stroke-width="11"/>
    <circle cx="345" cy="400" r="9" fill="#57606f"/>
  </g>

  <!-- far leg（IK 踩踏，与踏板对齐） -->
<g id="leg-far">
    <line class="thighF" transform="translate(244 296) rotate(-27.91)" x1="0" y1="0" x2="0" y2="66" stroke="#d98c0f" stroke-width="8" stroke-linecap="round"/>
    <line class="shinF" transform="translate(274.89 354.33) rotate(23.11)" x1="0" y1="0" x2="0" y2="66" stroke="#d98c0f" stroke-width="7" stroke-linecap="round"/>

  </g>

  <!-- frame（海滩巡航车） -->
  <g fill="none" stroke="#2ba8a0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 400 L228 284"/>
    <path d="M180 400 L262 388"/>
    <path d="M228 284 C 255 270 300 272 330 288"/>
    <path d="M262 388 C 285 360 310 345 336 332"/>
    <path d="M330 286 L338 334"/>
    <path d="M338 334 C 342 365 344 382 345 400"/>
  </g>

  <!-- handlebar（后掠弯把） -->
  <g fill="none" stroke-linecap="round">
    <path d="M330 286 L327 268 C 324 254 310 250 298 256" stroke="#57606f" stroke-width="6"/>
    <path d="M302 254 L292 259" stroke="#4a3728" stroke-width="9"/>
  </g>

  <!-- saddle（大部分被鹈鹕屁股盖住） -->
  <line x1="228" y1="284" x2="226" y2="276" stroke="#57606f" stroke-width="6"/>
  <path d="M205 272 C 210 263 242 263 247 270 C 243 278 211 279 205 272 Z" fill="#6b4f3a" stroke="#57402f" stroke-width="2"/>

  <!-- front basket + fish -->
  <rect x="344" y="262" width="44" height="34" rx="4" fill="#d9a05b" stroke="#a9743a" stroke-width="2.5"/>
  <path d="M346 271 H386 M346 279 H386 M346 287 H386" stroke="#a9743a" stroke-width="1.5"/>
  <path d="M356 264 V294 M368 264 V294 M380 264 V294" stroke="#a9743a" stroke-width="1.5"/>
  <g id="fish">
    <path d="M353 252 L341 244 L344 252 L341 260 Z" fill="#7fb2d9" stroke="#5b8fbf" stroke-width="1.5"/>
    <ellipse cx="365" cy="252" rx="13" ry="6" fill="#7fb2d9" stroke="#5b8fbf" stroke-width="1.5"/>
    <circle cx="374" cy="251" r="1.5" fill="#33566f"/>
  </g>

<div id="hint">点一下 · 摇铃铛 🛎️</div>

<script>
(function () {
  var svg = document.getElementById('ride');
  var pupil = document.getElementById('pupil');
  var hint = document.getElementById('hint');
  var dinged = false;

  // 视差：场景轻微跟随鼠标
  window.addEventListener('pointermove', function (e) {
    var mx = e.clientX / window.innerWidth - .5;
    var my = e.clientY / window.innerHeight - .5;
    svg.style.transform = 'translate(' + (mx * 12) + 'px,' + (my * 8) + 'px)';

    // 眼珠看向鼠标
    var m = svg.getScreenCTM();
    if (!m) return;
    var pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    var dx = pt.x - 340, dy = pt.y - 140;
    var d = Math.hypot(dx, dy) || 1;
    var r = Math.min(3.2, d / 30);
    pupil.setAttribute('transform',
      'translate(' + (dx / d * r).toFixed(2) + ',' + (dy / d * r).toFixed(2) + ')');
  });

  // 车铃：双音 ding-dong
  function bell() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [[1318, 0], [1046, 150]].forEach(function (p) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = p[0];
        var t = ctx.currentTime + p[1] / 1000;
        g.gain.setValueAtTime(.22, t);
        g.gain.exponentialRampToValueAtTime(.001, t + .55);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + .6);
      });
    } catch (e) {}
  }

  // 点击：加速 + 铃声
  document.body.addEventListener('pointerdown', function () {
    document.body.classList.remove('boost');
    void document.body.offsetWidth; // 重启动画
    document.body.classList.add('boost');
    bell();
    if (!dinged) { dinged = true; hint.style.opacity = 0; }
    setTimeout(function () { document.body.classList.remove('boost'); }, 2000);
  });
})();
</script>
