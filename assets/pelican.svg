<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0f4"/>
      <stop offset="100%" stop-color="#e6f7ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a9dd6"/>
      <stop offset="100%" stop-color="#67cbea"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2dfae"/>
      <stop offset="100%" stop-color="#e8cf96"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="512" height="332" fill="url(#sky)"/>

  <!-- sun -->
  <path d="M131 88 L143 88 M120 113 L129 122 M95 124 L95 136 M70 113 L61 122 M59 88 L47 88 M70 63 L61 54 M95 52 L95 40 M120 63 L129 54" stroke="#ffd93b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="95" cy="88" r="30" fill="#ffd93b"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="390" cy="75" rx="34" ry="15"/>
    <ellipse cx="366" cy="83" rx="22" ry="12"/>
    <ellipse cx="412" cy="83" rx="20" ry="11"/>
    <ellipse cx="176" cy="132" rx="26" ry="11"/>
    <ellipse cx="158" cy="139" rx="16" ry="8"/>
  </g>

  <!-- seagulls -->
  <g fill="none" stroke="#5a6b7a" stroke-width="3" stroke-linecap="round">
    <path d="M148 176 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M352 128 q7,-7 14,0 q7,-7 14,0"/>
  </g>

  <!-- sea -->
  <rect x="0" y="330" width="512" height="66" fill="url(#sea)"/>

  <!-- sailboat -->
  <line x1="455" y1="322" x2="455" y2="296" stroke="#5a4632" stroke-width="2.5"/>
  <path d="M457 296 L477 318 L457 318 Z" fill="#ffffff"/>
  <path d="M453 300 L441 318 L453 318 Z" fill="#f2f2f2"/>
  <path d="M441 322 L469 322 L462 330 L448 330 Z" fill="#7a5230"/>

  <!-- waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.55" stroke-width="4">
    <path d="M24 352 q14,-8 28,0 t28,0"/>
    <path d="M300 344 q14,-8 28,0 t28,0"/>
    <path d="M90 372 q14,-8 28,0 t28,0"/>
    <path d="M360 370 q14,-8 28,0 t28,0"/>
  </g>

  <!-- sand -->
  <rect x="0" y="394" width="512" height="118" fill="url(#sand)"/>
  <rect x="0" y="394" width="512" height="9" fill="#d9c08f" opacity="0.8"/>

  <!-- foam edge -->
  <path d="M6 404 q18,-9 36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0 t36,0" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.75"/>

  <!-- starfish -->
  <path d="M0,-1 L0.2245,-0.309 L0.951,-0.309 L0.363,0.118 L0.588,0.809 L0,0.382 L-0.588,0.809 L-0.363,0.118 L-0.951,-0.309 L-0.2245,-0.309 Z" transform="translate(398 462) rotate(15) scale(13)" fill="#ff9f43" stroke="#e88b2f" stroke-width="0.15"/>

  <!-- shell -->
  <path d="M150 476 Q160 458 170 476 Z" fill="#f7c8d0" stroke="#e8a7b5" stroke-width="2"/>
  <path d="M160 462 L160 474" stroke="#e8a7b5" stroke-width="1.5"/>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <path d="M58 296 h30"/>
    <path d="M44 318 h24"/>
  </g>

  <!-- shadow -->
  <ellipse cx="262" cy="463" rx="128" ry="13" fill="#5b4a2f" opacity="0.18"/>

  <!-- rear wheel -->
  <g stroke="#c3c9d1" stroke-width="3.5">
    <line x1="125" y1="398" x2="245" y2="398"/>
    <line x1="125" y1="398" x2="245" y2="398" transform="rotate(30 185 398)"/>
    <line x1="125" y1="398" x2="245" y2="398" transform="rotate(60 185 398)"/>
    <line x1="125" y1="398" x2="245" y2="398" transform="rotate(90 185 398)"/>
    <line x1="125" y1="398" x2="245" y2="398" transform="rotate(120 185 398)"/>
    <line x1="125" y1="398" x2="245" y2="398" transform="rotate(150 185 398)"/>
  </g>
  <circle cx="185" cy="398" r="52" fill="none" stroke="#d8dde3" stroke-width="5"/>
  <circle cx="185" cy="398" r="60" fill="none" stroke="#2f3640" stroke-width="11"/>
  <circle cx="185" cy="398" r="9" fill="#57606f"/>

  <!-- front wheel -->
  <g stroke="#c3c9d1" stroke-width="3.5">
    <line x1="275" y1="398" x2="395" y2="398"/>
    <line x1="275" y1="398" x2="395" y2="398" transform="rotate(30 335 398)"/>
    <line x1="275" y1="398" x2="395" y2="398" transform="rotate(60 335 398)"/>
    <line x1="275" y1="398" x2="395" y2="398" transform="rotate(90 335 398)"/>
    <line x1="275" y1="398" x2="395" y2="398" transform="rotate(120 335 398)"/>
    <line x1="275" y1="398" x2="395" y2="398" transform="rotate(150 335 398)"/>
  </g>
  <circle cx="335" cy="398" r="52" fill="none" stroke="#d8dde3" stroke-width="5"/>
  <circle cx="335" cy="398" r="60" fill="none" stroke="#2f3640" stroke-width="11"/>
  <circle cx="335" cy="398" r="9" fill="#57606f"/>

  <!-- far leg + far pedal + far foot (behind frame) -->
  <path d="M242 292 Q 238 336 246 410" fill="none" stroke="#d98c0f" stroke-width="8" stroke-linecap="round"/>
  <rect x="236" y="407" width="20" height="7" rx="2" fill="#2f3640"/>
  <path d="M236 404 q10,-7 20,0 l-5,8 q-5,3 -10,-1 z" fill="#d98c0f"/>

  <!-- frame -->
  <g fill="none" stroke="#2ba8a0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 398 L230 285 L260 385 Z"/>
    <path d="M230 285 L312 282 L320 332 L335 398"/>
    <path d="M260 385 L320 332"/>
  </g>

  <!-- seat -->
  <line x1="230" y1="285" x2="227" y2="276" stroke="#57606f" stroke-width="6"/>
  <path d="M209 276 C 214 268 242 268 247 274 C 243 281 215 282 209 276 Z" fill="#6b4f3a" stroke="#57402f" stroke-width="2"/>

  <!-- handlebar -->
  <g fill="none" stroke-linecap="round">
    <path d="M312 282 L309 266 C 304 252 318 244 330 252" stroke="#57606f" stroke-width="6"/>
    <path d="M326 250 L336 257" stroke="#4a3728" stroke-width="8"/>
  </g>

  <!-- crank + near pedal -->
  <circle cx="260" cy="385" r="13" fill="none" stroke="#57606f" stroke-width="5"/>
  <line x1="260" y1="385" x2="273" y2="358" stroke="#57606f" stroke-width="6" stroke-linecap="round"/>
  <rect x="264" y="353" width="20" height="7" rx="2" fill="#2f3640"/>

  <!-- pelican -->
  <!-- tail -->
  <path d="M188 238 Q 152 226 138 246 L 158 258 Q 174 262 188 258 Z" fill="#fdfdf6" stroke="#e3decd" stroke-width="3"/>

  <!-- body -->
  <ellipse cx="240" cy="253" rx="64" ry="50" transform="rotate(-10 240 253)" fill="#fdfdf6" stroke="#e3decd" stroke-width="3"/>

  <!-- folded wing -->
  <path d="M258 236 Q 208 238 180 262 Q 210 274 242 270 Q 264 262 258 236 Z" fill="#f4f0e4" stroke="#e3decd" stroke-width="2"/>
  <path d="M246 262 q-20 6 -42 2 M252 252 q-24 8 -52 6" fill="none" stroke="#e3decd" stroke-width="2"/>

  <!-- neck -->
  <path d="M272 236 C 298 224 308 204 302 182" fill="none" stroke="#e3decd" stroke-width="30" stroke-linecap="round"/>
  <path d="M272 236 C 298 224 308 204 302 182" fill="none" stroke="#fdfdf6" stroke-width="24" stroke-linecap="round"/>

  <!-- scarf -->
  <path d="M284 212 Q 254 202 232 210 Q 246 220 266 220 Q 276 221 284 216 Z" fill="#e8493a"/>
  <path d="M284 216 Q 264 228 250 226 Q 262 216 275 212 Z" fill="#f06a5e"/>
  <path d="M288 196 Q 278 206 280 218" fill="none" stroke="#e8493a" stroke-width="11" stroke-linecap="round"/>
  <circle cx="285" cy="207" r="7" fill="#e8493a"/>

  <!-- head -->
  <circle cx="300" cy="170" r="25" fill="#fdfdf6" stroke="#e3decd" stroke-width="3"/>
  <path d="M281 152 Q 270 146 266 136 M277 160 Q 264 158 258 150" fill="none" stroke="#e3decd" stroke-width="4" stroke-linecap="round"/>

  <!-- cheek -->
  <circle cx="292" cy="181" r="5" fill="#f9c1c1" opacity="0.8"/>

  <!-- eye -->
  <circle cx="308" cy="163" r="5" fill="#23272e"/>
  <circle cx="310" cy="161" r="1.8" fill="#ffffff"/>
  <path d="M300 151 q8,-5 16,-1" fill="none" stroke="#23272e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- beak -->
  <path d="M312 180 Q 322 214 356 212 Q 384 208 396 183 Z" fill="#f7bd3e" stroke="#d98c0f" stroke-width="2.5"/>
  <path d="M312 157 L400 175 Q 406 179 398 184 L312 181 Z" fill="#f6a821" stroke="#d98c0f" stroke-width="2.5"/>
  <path d="M324 165 L352 170" fill="none" stroke="#d98c0f" stroke-width="2" stroke-linecap="round"/>

  <!-- fish tail peeking from pouch -->
  <path d="M344 204 l7,-15 l9,7 l-8,9 z" fill="#7fb2d9" stroke="#5b8fbf" stroke-width="1.5"/>

  <!-- near wing on handlebar -->
  <path d="M266 246 Q 294 252 322 262" fill="none" stroke="#e3decd" stroke-width="20" stroke-linecap="round"/>
  <path d="M266 246 Q 294 252 322 262" fill="none" stroke="#fdfdf6" stroke-width="15" stroke-linecap="round"/>

  <!-- near leg + webbed foot -->
  <path d="M250 296 Q 254 330 271 356" fill="none" stroke="#f5a623" stroke-width="9" stroke-linecap="round"/>
  <path d="M262 352 q10,-7 20,1 l-5,8 q-6,3 -11,-1 z" fill="#f5a623" stroke="#d98c0f" stroke-width="1.5"/>
</svg>
